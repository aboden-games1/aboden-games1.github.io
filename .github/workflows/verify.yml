name: Verify studio and preserved files
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: python3 scripts/verify-build.py
      - name: Every studio web game answers at its play URL
        run: |
          for url in $(node -p "require('./src/data/studio-games.json').games.map(g=>g.webUrl).filter(Boolean).join(' ')"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$url")
            echo "$code $url"; test "$code" = 200 || { echo "::error::$url answers $code"; exit 1; }
          done
      - name: Stats Worker unit tests (no install needed)
        run: node --test stats-worker/test/*.test.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-preview
          path: dist
          retention-days: 14
